name: Backfill weekly status

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: Comma-separated Monday dates to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --no-default-groups

      - name: Launch weekly status refresh
        env:
          DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          DAGSTER_CLOUD_DEPLOYMENT: ${{ secrets.DAGSTER_CLOUD_DEPLOYMENT }}
          DAGSTER_CLOUD_ENV: ${{ secrets.DAGSTER_CLOUD_ENV }}
          DAGSTER_CLOUD_LOCATION: ${{ secrets.DAGSTER_CLOUD_LOCATION }}
          DAGSTER_CLOUD_ORGANIZATION: ${{ secrets.DAGSTER_CLOUD_ORGANIZATION }}
          DAGSTER_CLOUD_URL: ${{ secrets.DAGSTER_CLOUD_URL }}
          WEEKS: ${{ inputs.weeks }}
        run: |
          CONFIG=$(uv run --no-sync python - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/Bucharest")).date()
          weeks = [date.fromisoformat(value.strip()) for value in os.environ["WEEKS"].split(",")]
          if not 1 <= len(weeks) <= 8 or len(set(weeks)) != len(weeks):
              raise ValueError("Give one to eight distinct weeks")
          if any(week.weekday() != 0 or week + timedelta(days=6) >= today for week in weeks):
              raise ValueError("Only completed Monday to Sunday weeks can be backfilled")
          print(json.dumps({
              "ops": {
                  "refresh_weekly_statuses": {
                      "config": {"week_starts": [week.isoformat() for week in weeks]}
                  }
              }
          }))
          PY
          )
          OUTPUT=$(uv run --no-sync dagster-cloud job launch \
            --organization "$DAGSTER_CLOUD_ORGANIZATION" \
            --deployment "$DAGSTER_CLOUD_DEPLOYMENT" \
            --location "$DAGSTER_CLOUD_LOCATION" \
            --job weekly_status_refresh \
            --config-json "$CONFIG" \
            --wait \
            --interval 30)
          printf '%s\n' "$OUTPUT"
          case "$OUTPUT" in
            *"finished successfully."*) ;;
            *) exit 1 ;;
          esac

      - name: Verify saved weekly reads
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
          WEEKS: ${{ inputs.weeks }}
        run: |
          uv run --no-sync python - <<'PY'
          import os

          from romanian_news.catalog_transport import catalog_query

          for value in os.environ["WEEKS"].split(","):
              week = value.strip()
              rows = catalog_query(
                  "SELECT current_version_id FROM artifacts WHERE id = %s "
                  "AND kind = 'news_weekly_read'",
                  [f"news:weekly_status:{week}"],
              )
              if len(rows) != 1 or not rows[0]["current_version_id"]:
                  raise RuntimeError(f"No published weekly read for {week}")
              print(f"{week}: published")
          PY
