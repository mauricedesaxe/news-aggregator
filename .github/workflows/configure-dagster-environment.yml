name: Configure Dagster production environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Set production database connection
    runs-on: ubuntu-22.04
    env:
      DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
      DAGSTER_CLOUD_ORGANIZATION: ${{ secrets.DAGSTER_CLOUD_ORGANIZATION }}
      DAGSTER_CLOUD_DEPLOYMENT: ${{ secrets.DAGSTER_CLOUD_DEPLOYMENT }}
      NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Dagster CLI
        run: python -m pip install dagster-dg-cli==1.13.19

      - name: Configure Dagster production environment
        run: |
          dg plus config set \
            --organization "$DAGSTER_CLOUD_ORGANIZATION" \
            --deployment "$DAGSTER_CLOUD_DEPLOYMENT" \
            --region eu
          dg plus create env NEWS_POSTGRES_DSN \
            --from-local-env \
            --scope full \
            --global \
            --yes \
            --target-path .
