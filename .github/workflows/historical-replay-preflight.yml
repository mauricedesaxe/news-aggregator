name: Inspect historical replay day

on:
  workflow_dispatch:
    inputs:
      day:
        description: Historical day to inspect (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"

      - name: Install locked dependencies
        run: uv sync --frozen --no-default-groups

      - name: Read catalog replay state
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
          ARCHIVE_DAY: ${{ inputs.day }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from datetime import date

          from romanian_news.analysis.embeddings import read_pending_embedding_references
          from romanian_news.analysis.relevance import read_pending_relevance_references
          from romanian_news.analysis.relevance_v3 import production_relevance_v3_request_id
          from romanian_news.archive.campaign import ARCHIVE_END, ARCHIVE_START
          from romanian_news.catalog.archive_model_spend import (
              read_archive_spend,
              read_archive_spend_holds,
          )
          from romanian_news.catalog.archive_report_coverage import read_retrospective_coverage
          from romanian_news.catalog.schema import NEWS_CATALOG_MIGRATIONS
          from romanian_news.catalog_transport import catalog_query
          from romanian_news.daily import read_daily_article_references

          day = date.fromisoformat(os.environ["ARCHIVE_DAY"])
          if not ARCHIVE_START <= day <= ARCHIVE_END:
              raise ValueError("Day is outside the one-year archive")
          schema = catalog_query(
              "SELECT COALESCE(MAX(version), 0) AS latest FROM news_schema_migrations"
          )[0]
          access = catalog_query(
              "SELECT has_schema_privilege(current_schema(), 'CREATE') AS can_create, "
              "to_regclass('news_archive_model_reservations') IS NOT NULL AS table_present, "
              "EXISTS (SELECT 1 FROM pg_class "
              "WHERE oid = to_regclass('news_archive_model_reservations') "
              "AND pg_get_userbyid(relowner) = current_user) AS table_owned"
          )[0]
          coverage = read_retrospective_coverage(day)
          articles = read_daily_article_references(day).values
          spend = read_archive_spend(day) if access["table_present"] else None
          holds = read_archive_spend_holds(day) if access["table_present"] else ()
          print(json.dumps({
              "day": day.isoformat(),
              "schema_migration_latest": schema["latest"],
              "schema_migration_required": NEWS_CATALOG_MIGRATIONS[-1].version,
              "runtime_can_create": access["can_create"],
              "spend_table_present": access["table_present"],
              "runtime_owns_spend_table": access["table_owned"],
              "outlets": coverage.included_outlets if coverage else (),
              "verified_pages": coverage.verified_page_count if coverage else 0,
              "captured_articles": coverage.captured_article_count if coverage else 0,
              "selected_articles": len(articles),
              "pending_relevance": len(read_pending_relevance_references(
                  day=day, request_id_for_article=production_relevance_v3_request_id
              )),
              "pending_embeddings": len(read_pending_embedding_references(day=day)),
              "spent_usd": str(spend.spent_usd) if spend else None,
              "held_usd": str(spend.held_usd) if spend else None,
              "calls": spend.calls if spend else None,
              "holds": [{
                  "reservation_id": str(hold.reservation_id),
                  "age_seconds": hold.age_seconds,
                  "operation": hold.operation_key,
                  "held_usd": str(hold.held_usd),
              } for hold in holds],
              "source_ready": bool(coverage and len(coverage.included_outlets) >= 2 and articles),
          }, sort_keys=True))
          PY
