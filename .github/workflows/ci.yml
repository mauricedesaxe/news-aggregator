name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Test and build Python project
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --group test

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync basedpyright --level error
          uv run --no-sync vulture
          uv run --no-sync xenon --max-absolute C --max-modules B --max-average A src/romanian_news

      - name: Test
        run: uv run --no-sync pytest

      - name: Validate Dagster definitions
        run: uv run --no-sync dg check defs

      - name: Build distributions
        run: uv build

  postgres:
    name: Verify PostgreSQL 15 schema
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEWS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --group test

      - name: Run schema contract
        run: uv run --no-sync pytest tests/contracts/postgres_news_schema_contract.py

  reader-image:
    name: Build and start reader image
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build reader image
        run: docker build -f deploy/reader/Dockerfile -t romanian-news-reader .

      - name: Verify reader liveness
        run: |
          docker run --detach --name romanian-news-reader --publish 8080:8080 \
            --env APP_PASSWORD=standalone-test-password \
            --env SESSION_SECRET=standalone-test-session-secret-0001 \
            romanian-news-reader
          trap 'docker logs romanian-news-reader; docker rm --force romanian-news-reader' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/livez
