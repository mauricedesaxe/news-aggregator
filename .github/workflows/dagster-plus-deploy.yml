name: Dagster+ Serverless deployment

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}/dagster-plus-deploy
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  definitions:
    name: Check Dagster definitions
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Install Dagster dependencies
        run: uv sync --frozen --group test

      - name: Check definitions
        run: uv run --no-sync dg check defs

      - name: Test Dagster assets
        run: uv run --no-sync pytest tests/worker

  deploy:
    name: Deploy Romanian news
    if: github.event_name == 'push'
    needs: definitions
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
      DAGSTER_CLOUD_ORGANIZATION: ${{ vars.DAGSTER_CLOUD_ORGANIZATION }}
      DAGSTER_CLOUD_URL: ${{ vars.DAGSTER_CLOUD_URL }}
      DAGSTER_CLOUD_ENV: ${{ vars.DAGSTER_CLOUD_ENV }}
      DAGSTER_CLOUD_YAML_PATH: .
      DAGSTER_CLOUD_FILE: dagster_cloud.yaml
      ENABLE_FAST_DEPLOYS: "true"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check deployment event
        id: prerun
        uses: dagster-io/dagster-cloud-action/actions/utils/prerun@e55c9cff97f4f6061da76841327167d257a6248c

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@e55c9cff97f4f6061da76841327167d257a6248c
        with:
          command: ci check --project-dir . --dagster-cloud-yaml-path dagster_cloud.yaml

      - name: Initialize build session
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/ci-init@e55c9cff97f4f6061da76841327167d257a6248c
        with:
          project_dir: .
          dagster_cloud_yaml_path: dagster_cloud.yaml
          deployment: ${{ vars.DAGSTER_CLOUD_DEPLOYMENT }}

      - name: Set up Python
        id: python
        if: steps.prerun.outputs.result == 'pex-deploy'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PEX build support
        if: steps.prerun.outputs.result == 'pex-deploy'
        run: ${{ steps.python.outputs.python-path }} -m pip install setuptools==80.9.0

      - name: Build Python executable
        if: steps.prerun.outputs.result == 'pex-deploy'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@e55c9cff97f4f6061da76841327167d257a6248c
        with:
          command: ci build --build-strategy=python-executable --python-version 3.12 --pex-deps-cache-from='${{ github.repository }}' --pex-deps-cache-to='${{ github.repository }}'

      - name: Deploy code location
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@e55c9cff97f4f6061da76841327167d257a6248c
        with:
          command: ci deploy

      - name: Write deployment summary
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@e55c9cff97f4f6061da76841327167d257a6248c
        with:
          command: ci status --output-format=markdown >> $GITHUB_STEP_SUMMARY
