name: Backfill historical page dates

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    environment: production
    strategy:
      fail-fast: false
      matrix:
        outlet: [hotnews, digi24]
    concurrency:
      group: archive-page-${{ matrix.outlet }}
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"

      - name: Install locked dependencies
        run: uv sync --frozen --no-default-groups

      - name: Check next historical pages
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
          ARCHIVE_OUTLET: ${{ matrix.outlet }}
        run: uv run --no-sync python scripts/advance_historical_page_checks.py --outlet "$ARCHIVE_OUTLET"
