name: Backfill historical page dates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    environment: production
    strategy:
      fail-fast: false
      matrix:
        outlet: [hotnews, digi24]
    concurrency:
      group: archive-page-${{ matrix.outlet }}
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up production Python
        uses: ./.github/actions/setup-production-python

      - name: Check next historical pages
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
          ARCHIVE_OUTLET: ${{ matrix.outlet }}
        run: uv run --no-sync python scripts/advance_historical_page_checks.py --outlet "$ARCHIVE_OUTLET"
