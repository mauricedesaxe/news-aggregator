name: Activate news catalog schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up production Python
        uses: ./.github/actions/setup-production-python

      - name: Apply migrations as schema owner
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_MIGRATION_DSN }}
          NEWS_POSTGRES_RUNTIME_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
        run: uv run --no-sync python scripts/activate_news_catalog_schema.py

      - name: Verify catalog migrations in Dagster runtime
        env:
          DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          DAGSTER_CLOUD_DEPLOYMENT: ${{ secrets.DAGSTER_CLOUD_DEPLOYMENT }}
          DAGSTER_CLOUD_ENV: ${{ secrets.DAGSTER_CLOUD_ENV }}
          DAGSTER_CLOUD_LOCATION: ${{ secrets.DAGSTER_CLOUD_LOCATION }}
          DAGSTER_CLOUD_ORGANIZATION: ${{ secrets.DAGSTER_CLOUD_ORGANIZATION }}
          DAGSTER_CLOUD_URL: ${{ secrets.DAGSTER_CLOUD_URL }}
        run: |
          OUTPUT=$(uv run --no-sync dagster-cloud job launch \
            --organization "$DAGSTER_CLOUD_ORGANIZATION" \
            --deployment "$DAGSTER_CLOUD_DEPLOYMENT" \
            --location "$DAGSTER_CLOUD_LOCATION" \
            --job catalog_schema_activation \
            --wait \
            --interval 30)
          printf '%s\n' "$OUTPUT"
          case "$OUTPUT" in
            *"finished successfully."*) ;;
            *) exit 1 ;;
          esac
