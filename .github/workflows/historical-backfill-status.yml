name: Inspect historical backfill runs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: List recent Dagster runs
        env:
          DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          DAGSTER_CLOUD_GRAPHQL_URL: ${{ secrets.DAGSTER_CLOUD_GRAPHQL_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          def execute(query, variables=None):
              body = json.dumps({"query": query, "variables": variables or {}}).encode()
              request = urllib.request.Request(
                  os.environ["DAGSTER_CLOUD_GRAPHQL_URL"],
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "Dagster-Cloud-Api-Token": os.environ["DAGSTER_CLOUD_API_TOKEN"],
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result.get("errors"):
                  raise RuntimeError(json.dumps(result["errors"]))
              return result["data"]

          query = """
          query RecentRuns($filter: RunsFilter!) {
            runsOrError(filter: $filter, limit: 100) {
              __typename
              ... on Runs {
                results {
                  runId jobName status startTime endTime
                  tags { key value }
                  assetSelection { path }
                }
              }
              ... on PythonError { message }
            }
          }
          """
          active = execute(query, {"filter": {
              "statuses": ["QUEUED", "NOT_STARTED", "STARTING", "STARTED", "CANCELING"]
          }})["runsOrError"]
          print("ACTIVE_RUNS", json.dumps(active))
          for job in ("__ASSET_JOB", "morning_report_check", "historical_daily_recovery_job"):
              runs = execute(query, {"filter": {"pipelineName": job}})["runsOrError"]
              if runs["__typename"] != "Runs":
                  raise RuntimeError(f"Dagster run query failed for {job}: {runs}")
              print("JOB_RUNS", job, json.dumps(runs["results"]))
              failures = [run for run in runs["results"] if run["status"] == "FAILURE"][:3]
              for run in failures:
                  logs = execute("""
                  query RunErrors($runId: ID!) {
                    logsForRun(runId: $runId) {
                      __typename
                      ... on EventConnection {
                        events {
                          __typename
                          ... on MessageEvent { message timestamp }
                          ... on ExecutionStepFailureEvent {
                            error { message stack causes { message stack } }
                          }
                          ... on RunFailureEvent {
                            error { message stack causes { message stack } }
                          }
                        }
                      }
                    }
                  }
                  """, {"runId": run["runId"]})["logsForRun"]
                  events = logs.get("events", [])
                  failure_events = [
                      event for event in events
                      if event["__typename"] in {"ExecutionStepFailureEvent", "RunFailureEvent"}
                  ]
                  print("RUN_ERRORS", run["runId"], json.dumps(failure_events or events[-8:]))

          sensors = execute("""
          query SensorState {
            repositoriesOrError {
              __typename
              ... on RepositoryConnection {
                nodes {
                  name
                  location { name }
                  sensors {
                    name
                    sensorState {
                      status
                      ticks(limit: 3) {
                        timestamp status
                        error { message stack }
                      }
                    }
                  }
                }
              }
            }
          }
          """)
          print("SENSOR_STATE", json.dumps(sensors))

          fields = execute("{ __type(name: \"RunsFilter\") { inputFields { name } } }")
          field_names = {field["name"] for field in fields["__type"]["inputFields"]}
          if not {"createdAfter", "createdBefore"} <= field_names:
              raise RuntimeError(f"Dagster time filters unavailable: {field_names}")
          windows = (
              ("outage_onset", "2026-10-08T21:20:00+00:00", "2026-10-08T22:10:00+00:00"),
              ("october_10", "2026-10-10T04:00:00+00:00", "2026-10-10T06:00:00+00:00"),
          )
          for label, start, end in windows:
              runs = execute(query, {"filter": {
                  "pipelineName": "__ASSET_JOB", "statuses": ["FAILURE"],
                  "createdAfter": datetime.fromisoformat(start).timestamp(),
                  "createdBefore": datetime.fromisoformat(end).timestamp(),
              }})["runsOrError"]
              if runs["__typename"] != "Runs":
                  raise RuntimeError(f"Dagster window query failed: {runs}")
              for run in reversed(runs["results"]):
                  print("WINDOW_RUN", label, json.dumps(run))
                  logs = execute("""
                  query FailureCauses($runId: ID!) {
                    logsForRun(runId: $runId) {
                      __typename
                      ... on EventConnection {
                        events {
                          __typename
                          ... on MessageEvent { message timestamp }
                          ... on ExecutionStepFailureEvent {
                            stepKey error { message causes { message } }
                          }
                        }
                      }
                    }
                  }
                  """, {"runId": run["runId"]})["logsForRun"]
                  for event in logs.get("events", []):
                      if event["__typename"] == "ExecutionStepFailureEvent":
                          print("WINDOW_FAILURE", label, run["runId"], json.dumps(event))
          PY
