name: Check historical article page metadata

on:
  workflow_dispatch:
    inputs:
      outlet:
        description: Publisher archive source
        required: true
        type: choice
        options:
          - hotnews
          - digi24
      start:
        description: First sitemap date (YYYY-MM-DD)
        required: true
        type: string
      end:
        description: Last sitemap date (YYYY-MM-DD, at most 31 days)
        required: true
        type: string
      limit:
        description: Maximum pages to check in this run (1 to 100)
        required: true
        type: number
        default: 50

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    concurrency:
      group: archive-page-${{ inputs.outlet }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up production Python
        uses: ./.github/actions/setup-production-python

      - name: Check page metadata
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
          ARCHIVE_OUTLET: ${{ inputs.outlet }}
          ARCHIVE_START: ${{ inputs.start }}
          ARCHIVE_END: ${{ inputs.end }}
          ARCHIVE_LIMIT: ${{ inputs.limit }}
        run: |
          uv run --no-sync python scripts/check_historical_archive_pages.py \
            --outlet "$ARCHIVE_OUTLET" --start "$ARCHIVE_START" --end "$ARCHIVE_END" \
            --limit "$ARCHIVE_LIMIT"
