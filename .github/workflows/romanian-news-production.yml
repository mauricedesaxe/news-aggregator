name: Romanian news production operation

on:
  workflow_dispatch:
    inputs:
      partition:
        description: Current Bucharest date for the feed probe, in YYYY-MM-DD format
        required: false
        type: string
      run_id:
        description: Existing Dagster run ID to inspect instead of a current-day feed probe
        required: false
        type: string
      enable_article_controller:
        description: Run the morning report health check after the current-day feed probe succeeds
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  activate-and-probe:
    name: Activate automation and run production probe
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --no-default-groups

      - name: Validate operation
        env:
          ENABLE_ARTICLE_CONTROLLER: ${{ inputs.enable_article_controller }}
          PARTITION: ${{ inputs.partition }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          partition = os.environ["PARTITION"]
          run_id = os.environ["RUN_ID"]
          enable_controller = os.environ["ENABLE_ARTICLE_CONTROLLER"].lower() == "true"
          assert sum(bool(value) for value in (partition, run_id)) == 1, (
              "Provide exactly one of partition or run_id"
          )
          assert not enable_controller or partition, (
              "Article controller activation requires a current-day feed probe"
          )
          if partition:
              requested_day = date.fromisoformat(partition)
              today = datetime.now(ZoneInfo("Europe/Bucharest")).date()
              assert requested_day == today, (
                  f"Feed probe partition must be the current Bucharest date: {today.isoformat()}"
              )
          PY

      - name: Verify PostgreSQL catalog
        if: inputs.partition != ''
        continue-on-error: true
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
        run: |
          uv run --no-sync python - <<'PY'
          from romanian_news.catalog.schema import ensure_news_catalog_schema
          from romanian_news.worker.catalog_status import print_catalog_status

          ensure_news_catalog_schema()
          print("PostgreSQL catalog connection and schema verified")
          print_catalog_status()
          PY

      - name: Start stored automation state
        if: inputs.partition != ''
        env:
          DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          DAGSTER_CLOUD_GRAPHQL_URL: ${{ secrets.DAGSTER_CLOUD_GRAPHQL_URL }}
          DAGSTER_CLOUD_LOCATION: ${{ secrets.DAGSTER_CLOUD_LOCATION }}
        run: |
          uv run --no-sync python - <<'PY'
          import os

          import requests

          url = os.environ["DAGSTER_CLOUD_GRAPHQL_URL"]
          location_name = os.environ["DAGSTER_CLOUD_LOCATION"]
          headers = {"Dagster-Cloud-Api-Token": os.environ["DAGSTER_CLOUD_API_TOKEN"]}


          def execute(query, variables=None):
              response = requests.post(
                  url,
                  headers=headers,
                  json={"query": query, "variables": variables or {}},
                  timeout=30,
              )
              response.raise_for_status()
              body = response.json()
              if body.get("errors"):
                  raise RuntimeError("Dagster GraphQL operation failed")
              return body["data"]


          repositories = execute(
              """
              query Repositories {
                repositoriesOrError {
                  __typename
                  ... on RepositoryConnection {
                    nodes { name location { name } }
                  }
                }
              }
              """
          )["repositoriesOrError"]
          if repositories["__typename"] != "RepositoryConnection":
              raise RuntimeError("Dagster repository lookup failed")
          matches = [
              node for node in repositories["nodes"] if node["location"]["name"] == location_name
          ]
          if len(matches) != 1:
              raise RuntimeError(f"Expected one Romanian news repository, found {len(matches)}")
          repository_name = matches[0]["name"]
          common = {
              "repositoryLocationName": location_name,
              "repositoryName": repository_name,
          }

          for schedule_name in (
              "hourly_registered_feed_poll",
              "youtube_source_poll",
              "youtube_approved_publication",
              "daily_morning_report_check",
              "quarter_hourly_news_feedback_sync",
              "scheduled_weekly_status",
              "scheduled_archive_page_backfill",
              "scheduled_archive_article_capture",
              "scheduled_retrospective_analysis",
          ):
              result = execute(
                  """
                  mutation StartSchedule($selector: ScheduleSelector!) {
                    startSchedule(scheduleSelector: $selector) {
                      __typename
                      ... on ScheduleStateResult { scheduleState { status } }
                      ... on PythonError { message }
                      ... on UnauthorizedError { message }
                    }
                  }
                  """,
                  {"selector": {**common, "scheduleName": schedule_name}},
              )["startSchedule"]
              if result["__typename"] != "ScheduleStateResult" or result["scheduleState"]["status"] != "RUNNING":
                  raise RuntimeError(f"Could not start {schedule_name}")
              print(f"{schedule_name}: RUNNING")

          for sensor_name in (
              "article_batch_controller",
              "romanian_news_automation",
              "youtube_relevance_controller",
              "weekly_report_freshness",
          ):
              sensor = execute(
                  """
                  mutation StartSensor($selector: SensorSelector!) {
                    startSensor(sensorSelector: $selector) {
                      __typename
                      ... on Sensor { sensorState { status } }
                      ... on SensorNotFoundError { message }
                      ... on PythonError { message }
                      ... on UnauthorizedError { message }
                    }
                  }
                  """,
                  {"selector": {**common, "sensorName": sensor_name}},
              )["startSensor"]
              if sensor["__typename"] != "Sensor" or sensor["sensorState"]["status"] != "RUNNING":
                  raise RuntimeError(f"Could not start {sensor_name}")
              print(f"{sensor_name}: RUNNING")
          PY

      - name: Inspect existing run
        if: inputs.run_id != ''
        env:
          DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          DAGSTER_CLOUD_GRAPHQL_URL: ${{ secrets.DAGSTER_CLOUD_GRAPHQL_URL }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          uv run --no-sync python - <<'PY'
          import os

          import requests

          response = requests.post(
              os.environ["DAGSTER_CLOUD_GRAPHQL_URL"],
              headers={"Dagster-Cloud-Api-Token": os.environ["DAGSTER_CLOUD_API_TOKEN"]},
              json={
                  "query": """
                      query RunDiagnostics($runId: ID!) {
                        pipelineRunOrError(runId: $runId) {
                          __typename
                          ... on Run {
                            status
                            jobName
                            eventConnection(limit: 80) {
                              events {
                                __typename
                                ... on MessageEvent { message }
                                ... on ExecutionStepFailureEvent {
                                  error {
                                    message
                                    cause { message }
                                  }
                                }
                              }
                            }
                          }
                          ... on PythonError { message }
                          ... on RunNotFoundError { message }
                        }
                      }
                  """,
                  "variables": {"runId": os.environ["RUN_ID"]},
              },
              timeout=30,
          )
          body = response.json()
          if body.get("errors"):
              raise RuntimeError(body["errors"][0]["message"])
          response.raise_for_status()
          run = body["data"]["pipelineRunOrError"]
          if run["__typename"] != "Run":
              raise RuntimeError(run.get("message") or "Dagster run was not found")
          print(f"Run status: {run['status']}")
          print(f"Job: {run['jobName']}")
          for row in run["eventConnection"]["events"]:
              text = row.get("message") or ""
              if text:
                  print(text)
              err = row.get("error") or {}
              if err.get("message"):
                  print(err["message"])
              nested = (err.get("cause") or {}).get("message")
              if nested:
                  print(nested)
          PY

      - name: Run current feed probe
        if: inputs.partition != ''
        env:
          DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          DAGSTER_CLOUD_DEPLOYMENT: ${{ secrets.DAGSTER_CLOUD_DEPLOYMENT }}
          DAGSTER_CLOUD_ENV: ${{ secrets.DAGSTER_CLOUD_ENV }}
          DAGSTER_CLOUD_LOCATION: ${{ secrets.DAGSTER_CLOUD_LOCATION }}
          DAGSTER_CLOUD_ORGANIZATION: ${{ secrets.DAGSTER_CLOUD_ORGANIZATION }}
          DAGSTER_CLOUD_URL: ${{ secrets.DAGSTER_CLOUD_URL }}
          PARTITION: ${{ inputs.partition }}
        run: |
          TAGS=$(uv run --no-sync python - <<'PY'
          import json
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          value = os.environ["PARTITION"]
          now = datetime.now(ZoneInfo("Europe/Bucharest"))
          assert date.fromisoformat(value) == now.date()
          print(json.dumps({
              "dagster/partition": value,
              "news/scheduled_at": now.isoformat(),
          }))
          PY
          )
          OUTPUT=$(uv run --no-sync dagster-cloud job launch \
            --organization "$DAGSTER_CLOUD_ORGANIZATION" \
            --deployment "$DAGSTER_CLOUD_DEPLOYMENT" \
            --location "$DAGSTER_CLOUD_LOCATION" \
            --job feed_poll \
            --tags "$TAGS" \
            --wait \
            --interval 30)
          printf '%s\n' "$OUTPUT"
          case "$OUTPUT" in
            *"finished successfully."*) ;;
            *) exit 1 ;;
          esac

      - name: Run morning report health check
        if: inputs.enable_article_controller && inputs.partition != ''
        env:
          DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          DAGSTER_CLOUD_DEPLOYMENT: ${{ secrets.DAGSTER_CLOUD_DEPLOYMENT }}
          DAGSTER_CLOUD_ENV: ${{ secrets.DAGSTER_CLOUD_ENV }}
          DAGSTER_CLOUD_LOCATION: ${{ secrets.DAGSTER_CLOUD_LOCATION }}
          DAGSTER_CLOUD_ORGANIZATION: ${{ secrets.DAGSTER_CLOUD_ORGANIZATION }}
          DAGSTER_CLOUD_URL: ${{ secrets.DAGSTER_CLOUD_URL }}
        run: |
          OUTPUT=$(uv run --no-sync dagster-cloud job launch \
            --organization "$DAGSTER_CLOUD_ORGANIZATION" \
            --deployment "$DAGSTER_CLOUD_DEPLOYMENT" \
            --location "$DAGSTER_CLOUD_LOCATION" \
            --job morning_report_check \
            --wait \
            --interval 30)
          printf '%s\n' "$OUTPUT"
          case "$OUTPUT" in
            *"finished successfully."*) ;;
            *) exit 1 ;;
          esac
