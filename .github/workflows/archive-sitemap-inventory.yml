name: Inventory historical article URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up production Python
        uses: ./.github/actions/setup-production-python

      - name: Print sitemap inventory
        env:
          NEWS_POSTGRES_DSN: ${{ secrets.NEWS_POSTGRES_DSN }}
        run: uv run --no-sync python scripts/inventory_historical_archive.py
